<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Задание 4: Найди подарок</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: #fdfcf0;
            color: #1e293b;
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .avatar-circle {
            width: 100px; /* Увеличен размер круга */
            height: 100px;
            border-radius: 50%;
            border: 5px solid #3b82f6;
            background: white;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
        }

        .cabinet {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
            background: #a16207;
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            border: 8px solid #713f12;
        }

        .drawer {
            background: #fefce8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            border-bottom: 5px solid #eab308;
            position: relative;
        }

        .drawer::after {
            content: '';
            width: 25%;
            height: 6px;
            background: #ca8a04;
            border-radius: 3px;
        }

        .drawer:active {
            transform: scale(0.95);
        }

        .drawer.correct {
            background: #86efac !important;
            border-bottom-color: #22c55e;
            animation: success-bounce 0.5s ease;
        }

        .drawer.wrong {
            background: #fca5a5 !important;
            border-bottom-color: #ef4444;
            animation: shake 0.4s;
        }

        @keyframes success-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .gift-icon {
            font-size: 40px;
            color: #e11d48;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen flex flex-col p-6">

    <!-- Header Section -->
    <div class="flex items-center gap-6 mb-8">
        <!-- Увеличенное изображение в кружочке -->
        <div class="avatar-circle">
            <img src="1.png" alt="Шкаф" class="w-full h-full object-cover">
        </div>
        
        <div class="flex-1">
            <div class="flex items-center gap-3 mb-1">
                <span class="bg-blue-600 text-white px-4 py-1 rounded-full text-sm font-black uppercase tracking-widest" id="level-badge">Уровень 1</span>
                <h1 class="text-2xl font-black text-blue-900 uppercase">Найди коробку</h1>
            </div>
            <!-- Увеличенный шрифт инструкции -->
            <p class="text-blue-800 font-bold text-xl leading-snug" id="instruction">
                Отсчитай <span class="text-orange-600 font-black" id="row-hint">3 полки снизу</span><br>
                и <span class="text-orange-600 font-black" id="col-hint">2-й ящик справа</span>!
            </p>
        </div>
    </div>

    <!-- Main Game Board -->
    <div class="flex-1 flex items-center justify-center">
        <div class="cabinet" id="cabinet">
            <!-- Cells generated by JS -->
        </div>
    </div>

    <!-- Modal for Win -->
    <div id="win-modal" class="fixed inset-0 bg-blue-900/80 hidden items-center justify-center z-50 p-6">
        <div class="bg-white rounded-3xl p-10 w-full max-w-sm text-center shadow-2xl border-8 border-yellow-400">
            <div class="text-7xl mb-4">🎁</div>
            <h2 class="text-4xl font-black text-slate-800 mb-2" id="modal-title">НАШЁЛ!</h2>
            <p class="text-slate-600 font-bold mb-8 text-lg" id="modal-text">Луни достал красивую коробку с бантом!</p>
            <button onclick="handleNext()" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl text-2xl shadow-lg active:transform active:scale-95 transition-all uppercase">
                Дальше
            </button>
        </div>
    </div>

    <script>
        const cabinet = document.getElementById('cabinet');
        const levels = [
            { r: 3, c: 2, textR: "3 полки снизу", textC: "2-й ящик справа" },
            { r: 1, c: 4, textR: "1 полку снизу", textC: "4-й ящик справа" },
            { r: 4, c: 1, textR: "4 полки снизу (верхняя)", textC: "1-й ящик справа" }
        ];

        let currentLevel = 0;
        let isLocked = false;

        function createBoard() {
            cabinet.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const drawer = document.createElement('div');
                    drawer.className = 'drawer';
                    drawer.onclick = () => check(drawer, r, c);
                    cabinet.appendChild(drawer);
                }
            }
            updateUI();
        }

        function updateUI() {
            const level = levels[currentLevel];
            document.getElementById('level-badge').innerText = `Уровень ${currentLevel + 1}`;
            document.getElementById('row-hint').innerText = level.textR;
            document.getElementById('col-hint').innerText = level.textC;
        }

        function check(el, r, c) {
            if (isLocked) return;
            
            const goal = levels[currentLevel];
            const targetR = 4 - goal.r;
            const targetC = 4 - goal.c;

            if (r === targetR && c === targetC) {
                isLocked = true;
                el.classList.add('correct');
                el.innerHTML = '<i class="fa-solid fa-gift gift-icon"></i>';
                
                setTimeout(() => showModal(), 700);
            } else {
                el.classList.add('wrong');
                setTimeout(() => el.classList.remove('wrong'), 400);
            }
        }

        function showModal() {
            const modal = document.getElementById('win-modal');
            const btn = modal.querySelector('button');
            
            if (currentLevel < levels.length - 1) {
                document.getElementById('modal-title').innerText = "ВЕРНО!";
                document.getElementById('modal-text').innerText = "Ты отлично считаешь! Готов к следующему?";
                btn.innerText = "СЛЕДУЮЩИЙ УРОВЕНЬ";
            } else {
                document.getElementById('modal-title').innerText = "ПОБЕДА!";
                document.getElementById('modal-text').innerText = "Ты прошел все уровни и нашел все подарки!";
                btn.innerText = "ИГРАТЬ СНОВА";
            }
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function handleNext() {
            currentLevel++;
            if (currentLevel >= levels.length) currentLevel = 0;
            document.getElementById('win-modal').classList.add('hidden');
            document.getElementById('win-modal').classList.remove('flex');
            isLocked = false;
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
