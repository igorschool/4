<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Задание 4: Найди подарок</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: #fdfcf0;
            color: #1e293b;
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Layout wrapper ── */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            height: 100dvh; /* dynamic viewport height handles browser chrome */
            width: 100%;
            padding: clamp(8px, 2vw, 24px);
            gap: clamp(8px, 2vh, 24px);
        }

        /* Landscape: side-by-side */
        @media (orientation: landscape) and (max-height: 600px) {
            .game-wrapper {
                flex-direction: row;
                align-items: center;
            }
            .header-section {
                flex: 0 0 auto;
                width: clamp(180px, 35vw, 320px);
                flex-direction: column;
                justify-content: center;
            }
            .board-section {
                flex: 1;
            }
        }

        /* ── Header section ── */
        .header-section {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vw, 24px);
            flex-shrink: 0;
        }

        .avatar-circle {
            width: clamp(56px, 10vw, 100px);
            height: clamp(56px, 10vw, 100px);
            border-radius: 50%;
            border: 4px solid #3b82f6;
            background: white;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
        }

        .level-badge {
            background: #2563eb;
            color: white;
            padding: 2px 12px;
            border-radius: 9999px;
            font-size: clamp(10px, 1.5vw, 14px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: inline-block;
        }

        .task-title {
            font-size: clamp(14px, 2.5vw, 24px);
            font-weight: 900;
            color: #1e3a8a;
            text-transform: uppercase;
        }

        .instruction-text {
            font-size: clamp(13px, 2vw, 20px);
            font-weight: 700;
            color: #1e40af;
            line-height: 1.35;
            margin-top: 2px;
        }

        .hint-highlight {
            color: #ea580c;
            font-weight: 900;
        }

        /* ── Board section ── */
        .board-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .cabinet {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: clamp(6px, 1.5vmin, 14px);
            background: #a16207;
            padding: clamp(8px, 2vmin, 18px);
            border-radius: clamp(12px, 3vmin, 22px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            border: clamp(4px, 1vmin, 9px) solid #713f12;

            /* Square, fitting inside available space */
            width: min(
                calc(100vw - clamp(16px, 4vw, 48px)),
                calc(100dvh - clamp(120px, 30dvh, 280px) - clamp(16px, 4vh, 48px))
            );
            aspect-ratio: 1 / 1;
        }

        /* Landscape small screens: constrain to height */
        @media (orientation: landscape) and (max-height: 600px) {
            .cabinet {
                width: min(
                    calc(65vw - clamp(16px, 3vw, 32px)),
                    calc(100dvh - clamp(16px, 4vh, 32px))
                );
            }
        }

        .drawer {
            background: #fefce8;
            border-radius: clamp(5px, 1vmin, 10px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            border-bottom: clamp(3px, 0.7vmin, 6px) solid #eab308;
            position: relative;
        }

        .drawer::after {
            content: '';
            width: 25%;
            height: clamp(4px, 0.8vmin, 7px);
            background: #ca8a04;
            border-radius: 3px;
        }

        .drawer:active {
            transform: scale(0.93);
        }

        .drawer.correct {
            background: #86efac !important;
            border-bottom-color: #22c55e;
            animation: success-bounce 0.5s ease;
        }

        .drawer.wrong {
            background: #fca5a5 !important;
            border-bottom-color: #ef4444;
            animation: shake 0.4s;
        }

        @keyframes success-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .gift-icon {
            font-size: clamp(20px, 4vmin, 44px);
            color: #e11d48;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        /* ── Win modal ── */
        #win-modal {
            position: fixed;
            inset: 0;
            background: rgba(30, 58, 138, 0.82);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: clamp(12px, 4vw, 32px);
        }

        #win-modal.flex {
            display: flex;
        }

        .modal-card {
            background: white;
            border-radius: clamp(16px, 4vw, 28px);
            padding: clamp(24px, 5vw, 48px) clamp(20px, 5vw, 40px);
            width: 100%;
            max-width: min(380px, 90vw);
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            border: clamp(4px, 1vw, 8px) solid #facc15;
        }

        .modal-emoji {
            font-size: clamp(48px, 10vw, 80px);
            margin-bottom: clamp(8px, 2vw, 16px);
            display: block;
        }

        .modal-title {
            font-size: clamp(24px, 5vw, 40px);
            font-weight: 900;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .modal-text {
            font-size: clamp(13px, 2.5vw, 18px);
            color: #475569;
            font-weight: 700;
            margin-bottom: clamp(16px, 4vw, 32px);
        }

        .modal-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            font-weight: 900;
            font-family: 'Nunito', sans-serif;
            padding: clamp(12px, 3vw, 22px) 0;
            border-radius: clamp(10px, 2.5vw, 18px);
            font-size: clamp(16px, 3.5vw, 24px);
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transition: transform 0.1s;
        }

        .modal-btn:active {
            transform: scale(0.96);
        }

        /* Tablet tweaks */
        @media (min-width: 600px) and (min-height: 700px) {
            .avatar-circle {
                width: clamp(72px, 10vw, 100px);
                height: clamp(72px, 10vw, 100px);
            }
        }
    </style>
</head>
<body>

<div class="game-wrapper">

    <!-- Header Section -->
    <div class="header-section">
        <div class="avatar-circle">
            <img src="1.png" alt="Шкаф" style="width:100%;height:100%;object-fit:cover;">
        </div>

        <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;">
                <span class="level-badge" id="level-badge">Уровень 1</span>
                <span class="task-title">Найди коробку</span>
            </div>
            <p class="instruction-text" id="instruction">
                Отсчитай <span class="hint-highlight" id="row-hint">3 полки снизу</span><br>
                и <span class="hint-highlight" id="col-hint">2-й ящик справа</span>!
            </p>
        </div>
    </div>

    <!-- Main Game Board -->
    <div class="board-section">
        <div class="cabinet" id="cabinet"></div>
    </div>

</div>

<!-- Modal for Win -->
<div id="win-modal">
    <div class="modal-card">
        <span class="modal-emoji">🎁</span>
        <div class="modal-title" id="modal-title">НАШЁЛ!</div>
        <p class="modal-text" id="modal-text">Луни достал красивую коробку с бантом!</p>
        <button class="modal-btn" id="modal-btn" onclick="handleNext()">Дальше</button>
    </div>
</div>

<script>
    const cabinet = document.getElementById('cabinet');
    const levels = [
        { r: 3, c: 2, textR: "3 полки снизу", textC: "2-й ящик справа" },
        { r: 1, c: 4, textR: "1 полку снизу", textC: "4-й ящик справа" },
        { r: 4, c: 1, textR: "4 полки снизу (верхняя)", textC: "1-й ящик справа" }
    ];

    let currentLevel = 0;
    let isLocked = false;

    function createBoard() {
        cabinet.innerHTML = '';
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                const drawer = document.createElement('div');
                drawer.className = 'drawer';
                drawer.onclick = () => check(drawer, r, c);
                cabinet.appendChild(drawer);
            }
        }
        updateUI();
    }

    function updateUI() {
        const level = levels[currentLevel];
        document.getElementById('level-badge').innerText = `Уровень ${currentLevel + 1}`;
        document.getElementById('row-hint').innerText = level.textR;
        document.getElementById('col-hint').innerText = level.textC;
    }

    function check(el, r, c) {
        if (isLocked) return;

        const goal = levels[currentLevel];
        const targetR = 4 - goal.r;
        const targetC = 4 - goal.c;

        if (r === targetR && c === targetC) {
            isLocked = true;
            el.classList.add('correct');
            el.innerHTML = '<i class="fa-solid fa-gift gift-icon"></i>';
            setTimeout(() => showModal(), 700);
        } else {
            el.classList.add('wrong');
            setTimeout(() => el.classList.remove('wrong'), 400);
        }
    }

    function showModal() {
        const modal = document.getElementById('win-modal');
        const btn = document.getElementById('modal-btn');

        if (currentLevel < levels.length - 1) {
            document.getElementById('modal-title').innerText = "ВЕРНО!";
            document.getElementById('modal-text').innerText = "Ты отлично считаешь! Готов к следующему?";
            btn.innerText = "СЛЕДУЮЩИЙ УРОВЕНЬ";
        } else {
            document.getElementById('modal-title').innerText = "ПОБЕДА!";
            document.getElementById('modal-text').innerText = "Ты прошел все уровни и нашел все подарки!";
            btn.innerText = "ИГРАТЬ СНОВА";
        }

        modal.classList.add('flex');
    }

    function handleNext() {
        currentLevel++;
        if (currentLevel >= levels.length) currentLevel = 0;
        document.getElementById('win-modal').classList.remove('flex');
        isLocked = false;
        createBoard();
    }

    createBoard();
</script>
</body>
</html>
