<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Игра: Собери предметы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; /* Отключаем стандартные жесты браузера (зум, скролл) */
        }

        body {
            font-family: Arial, sans-serif;
            background: #e0f7fa;
            overflow: hidden; /* Чтобы страница не дергалась при перетаскивании */
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .game-field {
            position: relative;
            width: 100%;
            flex-grow: 1;
            padding: 20px;
        }

        /* Предметы для перетаскивания */
        .item {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #ffcc80;
            border: 4px solid #f57c00;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: grab;
            z-index: 10;
            user-select: none;
        }

        /* Корзина / Коробка */
        .bin {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 120px;
            background: #8d6e63;
            border: 6px solid #5d4037;
            border-radius: 0 0 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            z-index: 5;
        }

        .bin::after {
            content: 'КОРЗИНА';
            font-size: 14px;
        }

        .bin.highlight {
            background: #a1887f;
            transform: translateX(-50%) scale(1.1);
        }
    </style>
</head>
<body>

    <div class="game-field" id="field">
        <div class="item" style="top: 50px; left: 30px;">🍎</div>
        <div class="item" style="top: 50px; left: 150px;">🧸</div>
        <div class="item" style="top: 150px; left: 80px;">🎨</div>

        <div class="bin" id="bin"></div>
    </div>

    <script>
        const items = document.querySelectorAll('.item');
        const bin = document.getElementById('bin');
        const field = document.getElementById('field');

        items.forEach(item => {
            item.addEventListener('touchstart', handleTouchStart, { passive: false });
            item.addEventListener('touchmove', handleTouchMove, { passive: false });
            item.addEventListener('touchend', handleTouchEnd);
        });

        let offsetX, offsetY;

        function handleTouchStart(e) {
            const touch = e.touches[0];
            const rect = this.getBoundingClientRect();
            
            // Запоминаем, где именно внутри элемента мы коснулись
            offsetX = touch.clientX - rect.left;
            offsetY = touch.clientY - rect.top;
            
            this.style.zIndex = 1000;
            this.style.cursor = 'grabbing';
        }

        function handleTouchMove(e) {
            e.preventDefault(); // Запрещаем скролл экрана
            const touch = e.touches[0];
            const item = e.target;

            // Двигаем элемент за пальцем
            let x = touch.clientX - offsetX;
            let y = touch.clientY - offsetY;

            item.style.left = x + 'px';
            item.style.top = y + 'px';

            // Проверяем, находится ли предмет над корзиной
            if (isOverlapping(item, bin)) {
                bin.classList.add('highlight');
            } else {
                bin.classList.remove('highlight');
            }
        }

        function handleTouchEnd(e) {
            const item = e.target;
            bin.classList.remove('highlight');

            if (isOverlapping(item, bin)) {
                // Если попали в корзину:
                item.style.position = 'relative';
                item.style.left = '0';
                item.style.top = '0';
                item.style.margin = '5px';
                item.style.pointerEvents = 'none'; // Больше нельзя вытащить
                
                bin.appendChild(item); // Кладем внутрь
                checkWin();
            }
        }

        // Функция проверки столкновения объектов
        function isOverlapping(el1, el2) {
            const r1 = el1.getBoundingClientRect();
            const r2 = el2.getBoundingClientRect();

            return !(r1.right < r2.left || 
                     r1.left > r2.right || 
                     r1.bottom < r2.top || 
                     r1.top > r2.bottom);
        }

        function checkWin() {
            const remaining = document.querySelectorAll('#field > .item').length;
            if (remaining === 0) {
                setTimeout(() => alert("Молодец! Все предметы в корзине!"), 300);
            }
        }
    </script>
</body>
</html>
